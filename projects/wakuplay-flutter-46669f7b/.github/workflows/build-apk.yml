name: Build APK WakuPlay
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Siapkan proyek Android (applicationId com.wakuplay.app, Kotlin/Java native, izin)
        run: WORK="$PWD" CI=1 bash scripts/bootstrap-android.sh
      - name: Analisis kode (tampilkan ERROR)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log || true
      - name: Build APK debug
        run: flutter build apk --debug --dart-define-from-file=env.json 2>&1 | tee build-debug.log
      - name: Build APK rilis (hanya jika secret kunci lama diisi)
        env:
          KS_B64: ${{ secrets.WP_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.WP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WP_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.WP_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            mkdir -p ~/.wakuplay
            echo "$KS_B64" | base64 -d > ~/.wakuplay/wakuplay.jks
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$HOME/.wakuplay/wakuplay.jks" "$KS_PASS" "$KEY_ALIAS" "${KEY_PASS:-$KS_PASS}" > ~/.wakuplay/sign.properties
            WORK="$PWD" python3 scripts/patch-signing.py
            flutter build apk --release --dart-define-from-file=env.json 2>&1 | tee build-release.log
          else
            echo "Secret kunci rilis belum diisi: lewati build rilis (APK debug tetap dibuat)."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WakuPlay-APK-dan-log
          path: |
            build/app/outputs/flutter-apk/*.apk
            analyze.log
            build-debug.log
            build-release.log
