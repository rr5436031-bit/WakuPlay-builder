name: Build WibuPlay APK

on:
  push:
    paths:
      - 'projects/WibuPlay/**'
      - '.github/workflows/build-wibuplay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        working-directory: projects/WibuPlay
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WibuPlay-APK
          path: projects/WibuPlay/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
